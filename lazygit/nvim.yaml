# Overlay merged on top of config.yaml only when lazygit is launched from
# lazygit.nvim (see nvim/lua/plugin_configs/lazygit.lua).
os:
  # Open files (`o`) in the parent Neovim instead of the OS default app:
  # quit lazygit (closing the float), then open the file as a buffer in the
  # current window. Mirrors lazygit's built-in `nvim-remote` edit preset.
  open: 'nvim --server "$NVIM" --remote-send q && nvim --server "$NVIM" --remote {{filename}}'
